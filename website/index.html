<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBITDA Portfolio Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>EBITDA Portfolio Dashboard</h1>
            <p>Real-time financial analysis from SEC data</p>
        </header>

        <div class="summary-cards">
            <div class="card">
                <h3>Total Companies</h3>
                <span id="total-companies">-</span>
            </div>
            <div class="card">
                <h3>Avg EBITDA Growth</h3>
                <span id="avg-growth">-</span>
            </div>
            <div class="card">
                <h3>Top Performer</h3>
                <span id="top-performer">-</span>
            </div>
        </div>

        <div class="data-section">
            <h2>Company Performance</h2>
            <div class="table-container">
                <table id="portfolio-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Company</th>
                            <th>Latest EBITDA</th>
                            <th>Growth %</th>
                            <th>MA Slope</th>
                            <th>Data Quality</th>
                        </tr>
                    </thead>
                    <tbody id="portfolio-tbody">
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="chart-section">
            <h2>EBITDA Trends</h2>
            <div id="chart-container">
                <canvas id="ebitda-chart"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
